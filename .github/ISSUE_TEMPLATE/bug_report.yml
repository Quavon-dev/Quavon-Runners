name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run the installer with ...
        2. Start a workflow with ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gha-runners doctor
      description: Output of `gha-runners doctor` inside the LXC (`pct exec <id> -- gha-runners doctor`). Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the installer, `journalctl -u gha-runner@<name>` or the job log. Make sure no tokens are included.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Proxmox VE version, image flavor, commit or image tag.
      placeholder: PVE 9.0, full, a8c6dc4
    validations:
      required: true
