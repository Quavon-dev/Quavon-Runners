version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories: [/image, /tests/lxc]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: chore
