name: image

on:
  push:
    branches: [main]
    paths: [image/**, .github/workflows/image.yml]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, full, full-plus]
    env:
      FLAVOR: ${{ matrix.flavor }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          docker system prune --all --force
          df -h /

      - name: Build
        run: |
          IMAGE="ghcr.io/${OWNER,,}/gha-runner"
          echo "IMAGE=${IMAGE}" >>"$GITHUB_ENV"
          tree="$(git rev-parse HEAD:image)"
          docker build --pull --progress=plain --build-arg FLAVOR="$FLAVOR" \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "${IMAGE}:${FLAVOR}-${tree}" -t "${IMAGE}:${FLAVOR}" image

      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          for attempt in 1 2 3; do
            if docker push --all-tags "$IMAGE"; then
              digest="$(docker buildx imagetools inspect "${IMAGE}:${FLAVOR}" --format '{{json .Manifest}}' | jq -r .digest)"
              echo "digest=${digest}" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push failed (attempt ${attempt}), retrying"
            sleep $((attempt * 20))
          done
          exit 1

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
